security:
    password_hashers:
        App\Entity\Admin\AdminUser: 'auto'

    providers:
        admin_users:
            entity:
                class: App\Entity\Admin\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: admin_users
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_dashboard
            logout:
                path: _security_logout
                target: admin_login

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/locations/feed$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/public-invitations$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/v1/public-invitations/validate$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Entity\Admin\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
